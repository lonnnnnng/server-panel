name: 检查与构建
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: 格式检查
        run: test -z "$(gofmt -l *.go)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: 脚本检查
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: 前端语法检查
        run: node --check public/app.js
      - name: 服务健康检查回归
        run: node scripts/service-test.cjs
      - name: Linux 二进制构建
        run: GOOS=linux GOARCH=amd64 ./scripts/build.sh
